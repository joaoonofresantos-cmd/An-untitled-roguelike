<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ondas Infinitas</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; overflow:hidden; }
  canvas { display:block; margin:auto; background:#1a1a2e; }
  #hud { position:absolute; top:10px; left:10px; font-size:16px; pointer-events:none; }
  #powerup {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.85);
  }
  #powerup h2 { margin-bottom:20px; }
  .card {
    background:#222; border:2px solid #444; padding:20px; margin:10px;
    width:400px; cursor:pointer; border-radius:8px; transition:0.2s;
  }
  .card:hover { border-color:#4af; background:#2a2a3e; }
  .card h3 { margin:0 0 8px; color:#4af; }
  .buff { color:#6f6; }
  .debuff { color:#f66; }
</style>
</head>
<body>
<canvas id="game" width="900" height="600"></canvas>
<div id="hud">
  <div>❤️ Vida: <span id="hp">100</span></div>
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🌊 Onda: <span id="wave">1</span></div>
  <div>👾 Inimigos: <span id="enemies">0</span></div>
</div>
<div id="powerup">
  <h2>Escolha um poder (e um preço...)</h2>
  <div id="cards"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ===== ESTADO DO JOGO =====
let game;

function initGame() {
  game = {
    player: {
      x: W/2, y: H/2, r: 12,
      hp: 100, maxHp: 100,
      speed: 3.2,
      fireRate: 20,      // frames entre tiros
      fireCooldown: 0,
      bulletSpeed: 8,
      bulletDamage: 10,
      bulletCount: 1,     // quantos tiros por disparo
      pierce: 0,
    },
    bullets: [],
    enemies: [],
    enemyBullets: [],
    keys: {},
    wave: 1,
    waveTimer: 0,
    waveEnemiesLeft: 0,
    waveSpawning: false,
    spawnTimer: 0,
    score: 0,
    mouseX: W/2, mouseY: H/2,
    paused: false,
    gameOver: false,
  };
}

// ===== INPUT =====
document.addEventListener('keydown', e => {
  game.keys[e.key.toLowerCase()] = true;
  if (game.gameOver && e.key === 'Enter') { initGame(); }
});
document.addEventListener('keyup', e => game.keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  game.mouseX = e.clientX - rect.left;
  game.mouseY = e.clientY - rect.top;
});

// ===== SISTEMA DE POWER-UPS =====
const powerUps = [
  {
    name: "Tiro Duplo",
    buff: "+1 projétil por disparo",
    debuff: "Recarga +40%",
    apply: p => { p.bulletCount++; p.fireRate *= 1.4; }
  },
  {
    name: "Velocidade",
    buff: "+25% velocidade de movimento",
    debuff: "-15 vida máxima",
    apply: p => { p.speed *= 1.25; p.maxHp -= 15; p.hp = Math.min(p.hp, p.maxHp); }
  },
  {
    name: "Dano Pesado",
    buff: "+50% dano dos tiros",
    debuff: "-20% velocidade dos projéteis",
    apply: p => { p.bulletDamage *= 1.5; p.bulletSpeed *= 0.8; }
  },
  {
    name: "Cadência",
    buff: "-30% tempo de recarga",
    debuff: "-25% dano",
    apply: p => { p.fireRate *= 0.7; p.bulletDamage *= 0.75; }
  },
  {
    name: "Perfuração",
    buff: "Tiros atravessam +1 inimigo",
    debuff: "Recarga +30%",
    apply: p => { p.pierce++; p.fireRate *= 1.3; }
  },
  {
    name: "Cura Vampírica",
    buff: "+15 vida máxima e cura total",
    debuff: "-10% velocidade de movimento",
    apply: p => { p.maxHp += 15; p.hp = p.maxHp; p.speed *= 0.9; }
  },
  {
    name: "Bala Rápida",
    buff: "+40% velocidade dos projéteis",
    debuff: "-10 vida máxima",
    apply: p => { p.bulletSpeed *= 1.4; p.maxHp -= 10; p.hp = Math.min(p.hp, p.maxHp); }
  },
];

function showPowerUpChoice() {
  game.paused = true;
  const pool = [...powerUps].sort(() => Math.random() - 0.5).slice(0, 3);
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  pool.forEach(pu => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${pu.name}</h3>
      <div class="buff">▲ ${pu.buff}</div>
      <div class="debuff">▼ ${pu.debuff}</div>`;
    div.onclick = () => {
      pu.apply(game.player);
      document.getElementById('powerup').style.display = 'none';
      game.paused = false;
      game.wave++;
      startWave();
    };
    cards.appendChild(div);
  });
  document.getElementById('powerup').style.display = 'flex';
}

// ===== ONDAS =====
function startWave() {
  // Dificuldade cresce com a onda
  game.waveEnemiesLeft = 3 + Math.floor(game.wave * 1.5);
  game.waveSpawning = true;
  game.spawnTimer = 0;
}

function spawnEnemy() {
  // Spawna fora da tela
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  // Tipos de inimigos conforme onda
  const roll = Math.random();
  let type = 'basic';
  if (game.wave >= 3 && roll < 0.25) type = 'fast';
  if (game.wave >= 6 && roll > 0.85) type = 'tank';

  const base = {
    x, y,
    hp: 20 + game.wave * 3,
    r: 14,
    speed: 1.2 + game.wave * 0.05,
    color: '#f55',
    damage: 8,
    type
  };

  if (type === 'fast') {
    Object.assign(base, { speed: base.speed * 1.8, hp: base.hp * 0.6, r: 10, color: '#fa5' });
  } else if (type === 'tank') {
    Object.assign(base, { speed: base.speed * 0.6, hp: base.hp * 3, r: 20, color: '#a4f', damage: 15 });
  }

  game.enemies.push(base);
}

// ===== UPDATE =====
function update() {
  if (game.paused || game.gameOver) return;
  const p = game.player;

  // Movimento
  let dx = 0, dy = 0;
  if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
  if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
  if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
  if (game.keys['d'] || game.keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + dx * p.speed));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + dy * p.speed));

  // Tiro automático no mouse
  p.fireCooldown--;
  if (p.fireCooldown <= 0) {
    const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
    for (let i = 0; i < p.bulletCount; i++) {
      const spread = (i - (p.bulletCount - 1) / 2) * 0.15;
      const a = angle + spread;
      game.bullets.push({
        x: p.x, y: p.y,
        vx: Math.cos(a) * p.bulletSpeed,
        vy: Math.sin(a) * p.bulletSpeed,
        damage: p.bulletDamage,
        pierce: p.pierce,
        hit: []
      });
    }
    p.fireCooldown = p.fireRate;
  }

  // Spawn de inimigos
  if (game.waveSpawning) {
    game.spawnTimer--;
    if (game.spawnTimer <= 0 && game.waveEnemiesLeft > 0) {
      spawnEnemy();
      game.waveEnemiesLeft--;
      game.spawnTimer = Math.max(8, 30 - game.wave); // spawna mais rápido depois
    }
    if (game.waveEnemiesLeft <= 0) game.waveSpawning = false;
  }

  // Fim de onda
  if (!game.waveSpawning && game.enemies.length === 0) {
    if (game.wave % 10 === 0) {
      showPowerUpChoice();
    } else {
      game.wave++;
      startWave();
    }
  }

  // Update projéteis
  game.bullets = game.bullets.filter(b => {
    b.x += b.vx; b.y += b.vy;
    return b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
  });

  // Update inimigos
  game.enemies.forEach(e => {
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;
  });

  // Colisão bala x inimigo
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    for (let j = game.enemies.length - 1; j >= 0; j--) {
      const e = game.enemies[j];
      if (b.hit.includes(e)) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        e.hp -= b.damage;
        b.hit.push(e);
        if (e.hp <= 0) {
          game.enemies.splice(j, 1);
          game.score += 10 + game.wave;
        }
        if (b.pierce > 0) b.pierce--;
        else { game.bullets.splice(i, 1); break; }
      }
    }
  }

  // Colisão jogador x inimigo
  game.enemies.forEach(e => {
    if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
      p.hp -= e.damage * 0.3;
      // empurra inimigo
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.x += Math.cos(a) * 5;
      e.y += Math.sin(a) * 5;
    }
  });

  if (p.hp <= 0) game.gameOver = true;
}

// ===== RENDER =====
function draw() {
  ctx.clearRect(0, 0, W, H);

  // grid de fundo
  ctx.strokeStyle = '#252540';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const p = game.player;

  // projéteis
  ctx.fillStyle = '#4af';
  game.bullets.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
  });

  // inimigos
  game.enemies.forEach(e => {
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
    // barra de vida
    const hpPct = Math.max(0, e.hp / (20 + game.wave * 3));
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 4);
    ctx.fillStyle = '#f66';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * hpPct, 4);
  });

  // jogador
  ctx.fillStyle = '#6f6';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  // direção
  const a = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(a) * 20, p.y + Math.sin(a) * 20);
  ctx.stroke();

  // game over
  if (game.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VOCÊ MORREU', W/2, H/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('Score: ' + game.score + ' | Onda: ' + game.wave, W/2, H/2 + 30);
    ctx.fillText('Pressione ENTER para reiniciar', W/2, H/2 + 70);
  }

  // HUD
  document.getElementById('hp').textContent = Math.max(0, Math.floor(p.hp)) + '/' + p.maxHp;
  document.getElementById('score').textContent = game.score;
  document.getElementById('wave').textContent = game.wave;
  document.getElementById('enemies').textContent = game.enemies.length;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
startWave();
loop();
</script>
</body>
</html>
