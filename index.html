<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ondas Infinitas</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; overflow:hidden; }
  canvas { display:block; margin:auto; background:#1a1a2e; outline:none; }
  #hud { position:absolute; top:10px; left:10px; font-size:16px; pointer-events:none; text-shadow:0 0 4px #000; }
  #powerup {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.85);
    z-index: 10;
  }
  #powerup h2 { margin-bottom:20px; }
  .card {
    background:#222; border:2px solid #444; padding:20px; margin:10px;
    width:400px; cursor:pointer; border-radius:8px; transition:0.2s;
  }
  .card:hover { border-color:#4af; background:#2a2a3e; transform: scale(1.03); }
  .card h3 { margin:0 0 8px; color:#4af; }
  .buff { color:#6f6; }
  .debuff { color:#f66; }
</style>
</head>
<body>
<canvas id="game" width="900" height="600" tabindex="0"></canvas>
<div id="hud">
  <div>❤️ Vida: <span id="hp">100</span></div>
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🌊 Onda: <span id="wave">1</span></div>
  <div>👾 Inimigos: <span id="enemies">0</span></div>
  <div>🌍 Bioma: <span id="biome">Planície</span></div>
</div>
<div id="powerup">
  <h2>Escolha um poder (e um preço...)</h2>
  <div id="cards"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ===== BIOMAS =====
const BIOMES = [
  { name: "Planície", bg: "#1a1a2e", grid: "#252540", obstacleColor: "#4a4a6a", obstacleEdge: "#6a6a8a", obstacleCount: 4 },
  { name: "Caverna",  bg: "#1a1010", grid: "#2a1a1a", obstacleColor: "#5a3a2a", obstacleEdge: "#8a5a3a", obstacleCount: 7 },
  { name: "Gelo",     bg: "#0e1a24", grid: "#1a2e3e", obstacleColor: "#3a6a8a", obstacleEdge: "#6aaad0", obstacleCount: 5 },
  { name: "Vulcão",   bg: "#1a0a0a", grid: "#3a1515", obstacleColor: "#4a2020", obstacleEdge: "#a03a1a", obstacleCount: 6 },
  { name: "Ruínas",   bg: "#15151a", grid: "#2a2a35", obstacleColor: "#3a3a45", obstacleEdge: "#7a7a85", obstacleCount: 8 }
];

// ===== ESTADO DO JOGO =====
let game;

function initGame() {
  game = {
    player: {
      x: W/2, y: H/2, r: 12,
      hp: 100, maxHp: 100,
      speed: 3.2,
      fireRate: 20,
      fireCooldown: 0,
      bulletSpeed: 8,
      bulletDamage: 10,
      bulletCount: 1,
      pierce: 0,
      hitFlash: 0,
    },
    bullets: [],
    enemies: [],
    particles: [],
    obstacles: [],
    keys: {},
    wave: 1,
    waveTimer: 0,
    waveEnemiesLeft: 0,
    waveSpawning: false,
    spawnTimer: 0,
    score: 0,
    mouseX: W/2, mouseY: H/2,
    paused: false,
    gameOver: false,
    biomeIndex: 0,
    shake: 0,
    bgPulse: 0,
  };
  generateObstacles();
}

// ===== GERAÇÃO DE OBSTÁCULOS =====
function generateObstacles() {
  const biome = BIOMES[game.biomeIndex];
  game.obstacles = [];
  const margin = 80;
  const centerSafe = 140;

  let attempts = 0;
  while (game.obstacles.length < biome.obstacleCount && attempts < 200) {
    attempts++;
    const w = 40 + Math.random() * 80;
    const h = 40 + Math.random() * 80;
    const x = margin + Math.random() * (W - margin*2 - w);
    const y = margin + Math.random() * (H - margin*2 - h);

    if (x < W/2 + centerSafe && x + w > W/2 - centerSafe &&
        y < H/2 + centerSafe && y + h > H/2 - centerSafe) continue;

    let overlap = false;
    for (const o of game.obstacles) {
      if (x < o.x + o.w + 30 && x + w + 30 > o.x &&
          y < o.y + o.h + 30 && y + h + 30 > o.y) {
        overlap = true; break;
      }
    }
    if (overlap) continue;

    game.obstacles.push({
      x, y, w, h,
      color: biome.obstacleColor,
      edge: biome.obstacleEdge,
    });
  }
}

// ===== MUDANÇA DE BIOMA =====
function changeBiome() {
  game.biomeIndex = (game.biomeIndex + 1) % BIOMES.length;
  generateObstacles();
  game.bgPulse = 1;
  game.enemies.forEach(e => resolveCircleObstacles(e));
}

// ===== COLISÃO =====
function circleRectCollide(cx, cy, r, rect) {
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - closestX, dy = cy - closestY;
  return dx*dx + dy*dy < r*r;
}

function resolveCircleObstacles(entity) {
  for (const o of game.obstacles) {
    const closestX = Math.max(o.x, Math.min(entity.x, o.x + o.w));
    const closestY = Math.max(o.y, Math.min(entity.y, o.y + o.h));
    const dx = entity.x - closestX;
    const dy = entity.y - closestY;
    const dist = Math.hypot(dx, dy);
    if (dist < entity.r) {
      if (dist === 0) {
        const cx = o.x + o.w/2, cy = o.y + o.h/2;
        entity.x += (entity.x - cx) * 0.1;
        entity.y += (entity.y - cy) * 0.1;
      } else {
        const push = (entity.r - dist);
        entity.x += (dx / dist) * push;
        entity.y += (dy / dist) * push;
      }
    }
  }
}

// ===== PARTÍCULAS =====
function spawnHitParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

// ===== POWER-UPS =====
const powerUps = [
  { name: "Tiro Duplo", buff: "+1 projétil por disparo", debuff: "Recarga +40%",
    apply: p => { p.bulletCount++; p.fireRate *= 1.4; } },
  { name: "Velocidade", buff: "+25% velocidade", debuff: "-15 vida máxima",
    apply: p => { p.speed *= 1.25; p.maxHp -= 15; p.hp = Math.min(p.hp, p.maxHp); } },
  { name: "Dano Pesado", buff: "+50% dano", debuff: "-20% velocidade projétil",
    apply: p => { p.bulletDamage *= 1.5; p.bulletSpeed *= 0.8; } },
  { name: "Cadência", buff: "-30% recarga", debuff: "-25% dano",
    apply: p => { p.fireRate *= 0.7; p.bulletDamage *= 0.75; } },
  { name: "Perfuração", buff: "Tiros atravessam +1 inimigo", debuff: "Recarga +30%",
    apply: p => { p.pierce++; p.fireRate *= 1.3; } },
  { name: "Vampírico", buff: "+15 vida máx e cura total", debuff: "-10% velocidade",
    apply: p => { p.maxHp += 15; p.hp = p.maxHp; p.speed *= 0.9; } },
  { name: "Bala Rápida", buff: "+40% velocidade projétil", debuff: "-10 vida máxima",
    apply: p => { p.bulletSpeed *= 1.4; p.maxHp -= 10; p.hp = Math.min(p.hp, p.maxHp); } },
];

function showPowerUpChoice() {
  game.paused = true;
  const pool = [...powerUps].sort(() => Math.random() - 0.5).slice(0, 3);
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  pool.forEach(pu => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${pu.name}</h3>
      <div class="buff">▲ ${pu.buff}</div>
      <div class="debuff">▼ ${pu.debuff}</div>`;
    div.onclick = () => {
      pu.apply(game.player);
      document.getElementById('powerup').style.display = 'none';
      game.paused = false;
      game.wave++;
      if (game.wave % 5 === 0) changeBiome();
      startWave();
      canvas.focus();
    };
    cards.appendChild(div);
  });
  document.getElementById('powerup').style.display = 'flex';
}

// ===== ONDAS =====
function startWave() {
  game.waveEnemiesLeft = 3 + Math.floor(game.wave * 1.5);
  game.waveSpawning = true;
  game.spawnTimer = 0;
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const roll = Math.random();
  let type = 'basic';
  if (game.wave >= 3 && roll < 0.25) type = 'fast';
  if (game.wave >= 6 && roll > 0.85) type = 'tank';

  const base = {
    x, y,
    hp: 20 + game.wave * 3,
    r: 14,
    speed: 1.2 + game.wave * 0.05,
    color: '#f55',
    damage: 8,
    type,
    hitFlash: 0,
    wobble: Math.random() * Math.PI * 2,
  };
  if (type === 'fast') Object.assign(base, { speed: base.speed * 1.8, hp: base.hp * 0.6, r: 10, color: '#fa5' });
  else if (type === 'tank') Object.assign(base, { speed: base.speed * 0.6, hp: base.hp * 3, r: 20, color: '#a4f', damage: 15 });

  game.enemies.push(base);
}

// ===== UPDATE =====
function update() {
  if (game.paused || game.gameOver) return;
  const p = game.player;

  if (game.shake > 0) game.shake *= 0.85;
  if (game.bgPulse > 0) game.bgPulse *= 0.92;
  if (p.hitFlash > 0) p.hitFlash--;

  // Movimento — aceita WASD e setas (case-insensitive)
  let dx = 0, dy = 0;
  if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
  if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
  if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
  if (game.keys['d'] || game.keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  p.x += dx * p.speed;
  p.y += dy * p.speed;

  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));

  resolveCircleObstacles(p);

  // Tiro
  p.fireCooldown--;
  if (p.fireCooldown <= 0) {
    const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
    for (let i = 0; i < p.bulletCount; i++) {
      const spread = (i - (p.bulletCount - 1) / 2) * 0.15;
      const a = angle + spread;
      game.bullets.push({
        x: p.x + Math.cos(a) * 14,
        y: p.y + Math.sin(a) * 14,
        vx: Math.cos(a) * p.bulletSpeed,
        vy: Math.sin(a) * p.bulletSpeed,
        damage: p.bulletDamage,
        pierce: p.pierce,
        hit: [],
        trail: [],
        angle: a,
      });
    }
    p.fireCooldown = p.fireRate;
  }

  // Spawn inimigos
  if (game.waveSpawning) {
    game.spawnTimer--;
    if (game.spawnTimer <= 0 && game.waveEnemiesLeft > 0) {
      spawnEnemy();
      game.waveEnemiesLeft--;
      game.spawnTimer = Math.max(8, 30 - game.wave);
    }
    if (game.waveEnemiesLeft <= 0) game.waveSpawning = false;
  }

  // Fim de onda
  if (!game.waveSpawning && game.enemies.length === 0) {
    if (game.wave % 10 === 0) {
      showPowerUpChoice();
    } else {
      game.wave++;
      if (game.wave % 5 === 0) changeBiome();
      startWave();
    }
  }

  // Update balas
  game.bullets = game.bullets.filter(b => {
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();
    b.x += b.vx; b.y += b.vy;

    for (const o of game.obstacles) {
      if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) {
        spawnHitParticles(b.x, b.y, '#8af', 5);
        return false;
      }
    }
    return b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
  });

  // Update inimigos
  game.enemies.forEach(e => {
    if (e.hitFlash > 0) e.hitFlash--;
    e.wobble += 0.1;

    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const oldX = e.x, oldY = e.y;
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;

    resolveCircleObstacles(e);
    if (Math.hypot(e.x - oldX, e.y - oldY) < e.speed * 0.3) {
      e.x += Math.cos(a + Math.PI/2) * e.speed * 0.6;
      e.y += Math.sin(a + Math.PI/2) * e.speed * 0.6;
      resolveCircleObstacles(e);
    }
  });

  // Colisão bala x inimigo
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    for (let j = game.enemies.length - 1; j >= 0; j--) {
      const e = game.enemies[j];
      if (b.hit.includes(e)) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        e.hp -= b.damage;
        e.hitFlash = 6;
        b.hit.push(e);
        spawnHitParticles(b.x, b.y, e.color, 6);
        if (e.hp <= 0) {
          spawnHitParticles(e.x, e.y, e.color, 14);
          game.enemies.splice(j, 1);
          game.score += 10 + game.wave;
        }
        if (b.pierce > 0) b.pierce--;
        else { game.bullets.splice(i, 1); break; }
      }
    }
  }

  // Colisão jogador x inimigo
  game.enemies.forEach(e => {
    if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
      p.hp -= e.damage * 0.3;
      p.hitFlash = 8;
      game.shake = 6;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.x += Math.cos(a) * 5;
      e.y += Math.sin(a) * 5;
      resolveCircleObstacles(e);
    }
  });

  // Partículas
  game.particles = game.particles.filter(pt => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vx *= 0.94;
    pt.vy *= 0.94;
    pt.life--;
    return pt.life > 0;
  });

  if (p.hp <= 0) game.gameOver = true;
}

// ===== RENDER =====
function draw() {
  const biome = BIOMES[game.biomeIndex];

  ctx.save();
  if (game.shake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * game.shake,
      (Math.random() - 0.5) * game.shake
    );
  }

  let bgColor = biome.bg;
  if (game.bgPulse > 0.05) {
    bgColor = mixColors(biome.bg, '#ffffff', game.bgPulse * 0.6);
  }
  ctx.fillStyle = bgColor;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.strokeStyle = biome.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  const p = game.player;

  // obstáculos
  game.obstacles.forEach(o => {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(o.x + 4, o.y + 4, o.w, o.h);
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = o.edge;
    ctx.fillRect(o.x, o.y, o.w, 3);
    ctx.fillRect(o.x, o.y, 3, o.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i < o.w; i += 12) {
      ctx.beginPath();
      ctx.moveTo(o.x + i, o.y);
      ctx.lineTo(o.x + i, o.y + o.h);
      ctx.stroke();
    }
  });

  // partículas
  game.particles.forEach(pt => {
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * alpha, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // projéteis
  game.bullets.forEach(b => {
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const a = (i / b.trail.length) * 0.7;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#8af';
      ctx.beginPath();
      ctx.arc(t.x, t.y, 2 + i * 0.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#cfefff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(120,180,255,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
  });

  // inimigos
  game.enemies.forEach(e => {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(e.x + 3, e.y + 3, e.r, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    const pulse = 1 + Math.sin(e.wobble) * 0.08;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * pulse, 0, Math.PI*2); ctx.stroke();

    const a = Math.atan2(p.y - e.y, p.x - e.x);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(a - 0.4) * e.r * 0.4, e.y + Math.sin(a - 0.4) * e.r * 0.4, e.r * 0.18, 0, Math.PI*2);
    ctx.arc(e.x + Math.cos(a + 0.4) * e.r * 0.4, e.y + Math.sin(a + 0.4) * e.r * 0.4, e.r * 0.18, 0, Math.PI*2);
    ctx.fill();

    const hpPct = Math.max(0, e.hp / (20 + game.wave * 3));
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 4);
    ctx.fillStyle = '#f66';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * hpPct, 4);
  });

  // jogador
  const pColor = p.hitFlash > 0 ? '#fff' : '#6f6';
  ctx.fillStyle = 'rgba(100,255,100,0.15)';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(p.x + 2, p.y + 3, p.r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = pColor;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#2a6a2a';
  ctx.lineWidth = 2;
  ctx.stroke();
  const a = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + Math.cos(a) * 20, p.y + Math.sin(a) * 20);
  ctx.stroke();

  ctx.restore();

  if (game.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VOCÊ MORREU', W/2, H/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('Score: ' + game.score + ' | Onda: ' + game.wave, W/2, H/2 + 30);
    ctx.fillText('Pressione ENTER para reiniciar', W/2, H/2 + 70);
  }

  document.getElementById('hp').textContent = Math.max(0, Math.floor(p.hp)) + '/' + p.maxHp;
  document.getElementById('score').textContent = game.score;
  document.getElementById('wave').textContent = game.wave;
  document.getElementById('enemies').textContent = game.enemies.length;
  document.getElementById('biome').textContent = biome.name;
}

function mixColors(c1, c2, t) {
  const h1 = parseInt(c1.slice(1), 16);
  const h2 = parseInt(c2.slice(1), 16);
  const r = Math.round(((h1 >> 16) & 255) * (1-t) + ((h2 >> 16) & 255) * t);
  const g = Math.round(((h1 >> 8) & 255) * (1-t) + ((h2 >> 8) & 255) * t);
  const b = Math.round((h1 & 255) * (1-t) + (h2 & 255) * t);
  return `rgb(${r},${g},${b})`;
}

// ===== INPUT =====
canvas.focus();
canvas.addEventListener('click', () => canvas.focus());

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
    e.preventDefault();
  }
  game.keys[k] = true;
  if (game.gameOver && e.key === 'Enter') {
    initGame();
    startWave();
    canvas.focus();
  }
});

document.addEventListener('keyup', e => {
  game.keys[e.key.toLowerCase()] = false;
});

window.addEventListener('blur', () => {
  game.keys = {};
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  game.mouseX = (e.clientX - rect.left) * scaleX;
  game.mouseY = (e.clientY - rect.top) * scaleY;
});

// ===== LOOP =====
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

initGame();
startWave();
loop();
</script>
</body>
</html>
