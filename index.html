<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ondas Infinitas</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; overflow:hidden; }
  canvas { display:block; margin:auto; background:#1a1a2e; outline:none; }
  #hud { position:absolute; top:10px; left:10px; font-size:16px; pointer-events:none; text-shadow:0 0 4px #000; }
  #weaponHud {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none; text-shadow:0 0 4px #000;
  }
  #weaponName { font-size:18px; font-weight:bold; color:#4af; margin-bottom:4px; }
  #specialBar {
    width:300px; height:14px; background:#222; border:2px solid #444; border-radius:8px;
    overflow:hidden; position:relative;
  }
  #specialFill {
    height:100%; width:0%; background:linear-gradient(90deg,#4af,#8ff);
    transition:width 0.15s linear;
  }
  #specialBar.ready { border-color:#8ff; box-shadow:0 0 12px #4af; animation:pulse 0.8s infinite alternate; }
  @keyframes pulse { from { box-shadow:0 0 8px #4af; } to { box-shadow:0 0 20px #8ff; } }
  #specialText { font-size:12px; margin-top:4px; color:#aaa; }
  #powerup {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.85);
    z-index: 10;
  }
  #powerup h2 { margin-bottom:20px; }
  .card {
    background:#222; border:2px solid #444; padding:20px; margin:10px;
    width:400px; cursor:pointer; border-radius:8px; transition:0.2s;
  }
  .card:hover { border-color:#4af; background:#2a2a3e; transform: scale(1.03); }
  .card h3 { margin:0 0 8px; color:#4af; }
  .buff { color:#6f6; }
  .debuff { color:#f66; }
</style>
</head>
<body>
<canvas id="game" width="900" height="600" tabindex="0"></canvas>
<div id="hud">
  <div>❤️ Vida: <span id="hp">100</span></div>
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🌊 Onda: <span id="wave">1</span></div>
  <div>👾 Inimigos: <span id="enemies">0</span></div>
  <div>🌍 Bioma: <span id="biome">Planície</span></div>
</div>
<div id="weaponHud">
  <div id="weaponName">Pistola</div>
  <div id="specialBar"><div id="specialFill"></div></div>
  <div id="specialText">Especial: 0/10 kills — pressione [Q] ou [Botão Direito]</div>
</div>
<div id="powerup">
  <h2>Escolha um poder (e um preço...)</h2>
  <div id="cards"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ============================================================
// CONFIGURAÇÃO DE SPRITES
// ------------------------------------------------------------
// Quando você tiver as imagens, coloque os arquivos em uma pasta
// "sprites/" no mesmo diretório do index.html, ex:
//   sprites/player.png
//   sprites/enemy_basic.png
//   sprites/bullet.png
//
// Depois, basta carregar as imagens aqui embaixo e mudar o valor
// de SPRITES.xxx de null para a imagem carregada.
// O código de desenho JÁ ESTÁ PRONTO para usar sprite OU forma
// geométrica (fallback). Nada mais precisa ser mudado.
// ============================================================
const SPRITES = {
  player:     null,   // ex: new Image() -> carregar 'sprites/player.png'
  enemyBasic: null,
  enemyFast:  null,
  enemyTank:  null,
  bullet:     null,
  obstacle:   null,
};

// Função auxiliar para carregar sprite (use quando tiver os arquivos)
function loadSprite(key, src) {
  const img = new Image();
  img.onload = () => { SPRITES[key] = img; };
  img.onerror = () => console.warn('Falha ao carregar sprite:', src);
  img.src = src;
}
// Exemplo de uso (descomente quando tiver os arquivos):
// loadSprite('player', 'sprites/player.png');
// loadSprite('enemyBasic', 'sprites/enemy_basic.png');
// loadSprite('bullet', 'sprites/bullet.png');

// ============================================================
// SISTEMA DE DESENHO DE SPRITE COM FALLBACK
// ------------------------------------------------------------
// drawSprite(chave, x, y, tamanho, fallbackFn)
// - Se o sprite estiver carregado, desenha ele centralizado.
// - Se NÃO estiver, chama fallbackFn() que desenha a forma atual.
// Assim você pode substituir um sprite de cada vez.
// ============================================================
function drawSprite(key, x, y, size, angle, fallbackFn) {
  const img = SPRITES[key];
  if (img) {
    ctx.save();
    ctx.translate(x, y);
    if (angle !== undefined) ctx.rotate(angle);
    ctx.drawImage(img, -size/2, -size/2, size, size);
    ctx.restore();
  } else {
    fallbackFn();
  }
}

// ===== BIOMAS =====
const BIOMES = [
  { name: "Planície", bg: "#1a1a2e", grid: "#252540", obstacleColor: "#4a4a6a", obstacleEdge: "#6a6a8a", obstacleCount: 4 },
  { name: "Caverna",  bg: "#1a1010", grid: "#2a1a1a", obstacleColor: "#5a3a2a", obstacleEdge: "#8a5a3a", obstacleCount: 7 },
  { name: "Gelo",     bg: "#0e1a24", grid: "#1a2e3e", obstacleColor: "#3a6a8a", obstacleEdge: "#6aaad0", obstacleCount: 5 },
  { name: "Vulcão",   bg: "#1a0a0a", grid: "#3a1515", obstacleColor: "#4a2020", obstacleEdge: "#a03a1a", obstacleCount: 6 },
  { name: "Ruínas",   bg: "#15151a", grid: "#2a2a35", obstacleColor: "#3a3a45", obstacleEdge: "#7a7a85", obstacleCount: 8 }
];

// ===== ARMAS =====
// Cada arma tem seus stats e uma função de "especial".
// O especial é ativado quando a barra está cheia.
const WEAPONS = {
  pistol: {
    name: "Pistola",
    fireRate: 18,
    bulletSpeed: 9,
    bulletDamage: 12,
    bulletCount: 1,
    spread: 0,
    pierce: 0,
    killCost: 8,       // kills pra carregar o especial
    specialName: "Rajada Tripla",
    specialDesc: "Dispara 5 tiros rápidos em cone",
    special: (p, game) => {
      // rajada de 5 tiros em cone
      const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
      for (let i = 0; i < 5; i++) {
        const a = angle + (i - 2) * 0.12;
        game.bullets.push(makeBullet(p, a, p.bulletSpeed * 1.2, p.bulletDamage * 1.5, 1, 'special'));
      }
    }
  },
  shotgun: {
    name: "Escopeta",
    fireRate: 42,
    bulletSpeed: 7,
    bulletDamage: 8,
    bulletCount: 6,
    spread: 0.5,
    pierce: 0,
    killCost: 10,
    specialName: "Explosão",
    specialDesc: "Dispara uma bala enorme que explode",
    special: (p, game) => {
      const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
      game.bullets.push({
        ...makeBullet(p, angle, 6, 40, 0, 'explosive'),
        explosive: true,
        radius: 90,
      });
    }
  },
  smg: {
    name: "Metralhadora",
    fireRate: 5,
    bulletSpeed: 11,
    bulletDamage: 5,
    bulletCount: 1,
    spread: 0.18,
    pierce: 0,
    killCost: 12,
    specialName: "Overdrive",
    specialDesc: "Cadência absurda por 5 segundos",
    special: (p, game) => {
      p.overdrive = 300; // frames
    }
  },
  sniper: {
    name: "Sniper",
    fireRate: 55,
    bulletSpeed: 20,
    bulletDamage: 60,
    bulletCount: 1,
    spread: 0,
    pierce: 3,
    killCost: 6,
    specialName: "Perfurante",
    specialDesc: "Tiro que atravessa TODOS os inimigos",
    special: (p, game) => {
      const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
      game.bullets.push({
        ...makeBullet(p, angle, 25, 100, 999, 'pierce'),
        r: 8,
      });
    }
  },
};

function makeBullet(p, angle, speed, damage, pierce, type) {
  return {
    x: p.x + Math.cos(angle) * 16,
    y: p.y + Math.sin(angle) * 16,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    damage, pierce, hit: [], trail: [], angle,
    type: type || 'normal',
    life: 0,
    r: 4,
  };
}

// ===== ESTADO DO JOGO =====
let game;

function initGame() {
  game = {
    player: {
      x: W/2, y: H/2, r: 12,
      hp: 100, maxHp: 100,
      speed: 3.2,
      bulletSpeed: 9,
      bulletDamage: 10,
      bulletCount: 1,
      fireRate: 20,
      fireCooldown: 0,
      pierce: 0,
      hitFlash: 0,
      overdrive: 0,
    },
    weapon: 'pistol',           // arma atual
    weaponCooldown: 0,
    killCharge: 0,              // kills acumuladas pra especial
    bullets: [],
    enemies: [],
    particles: [],
    obstacles: [],
    keys: {},
    wave: 1,
    waveEnemiesLeft: 0,
    waveSpawning: false,
    spawnTimer: 0,
    score: 0,
    mouseX: W/2, mouseY: H/2,
    mouseDown: false,
    paused: false,
    gameOver: false,
    biomeIndex: 0,
    shake: 0,
    bgPulse: 0,
    screenFlash: 0,
  };
  generateObstacles();
}

// ===== OBSTÁCULOS =====
function generateObstacles() {
  const biome = BIOMES[game.biomeIndex];
  game.obstacles = [];
  const margin = 80;
  const centerSafe = 140;

  let attempts = 0;
  while (game.obstacles.length < biome.obstacleCount && attempts < 200) {
    attempts++;
    const w = 40 + Math.random() * 80;
    const h = 40 + Math.random() * 80;
    const x = margin + Math.random() * (W - margin*2 - w);
    const y = margin + Math.random() * (H - margin*2 - h);

    if (x < W/2 + centerSafe && x + w > W/2 - centerSafe &&
        y < H/2 + centerSafe && y + h > H/2 - centerSafe) continue;

    let overlap = false;
    for (const o of game.obstacles) {
      if (x < o.x + o.w + 30 && x + w + 30 > o.x &&
          y < o.y + o.h + 30 && y + h + 30 > o.y) { overlap = true; break; }
    }
    if (overlap) continue;

    game.obstacles.push({ x, y, w, h, color: biome.obstacleColor, edge: biome.obstacleEdge });
  }
}

function changeBiome() {
  game.biomeIndex = (game.biomeIndex + 1) % BIOMES.length;
  generateObstacles();
  game.bgPulse = 1;
  game.enemies.forEach(e => resolveCircleObstacles(e));
}

// ===== COLISÃO =====
function resolveCircleObstacles(entity) {
  for (const o of game.obstacles) {
    const closestX = Math.max(o.x, Math.min(entity.x, o.x + o.w));
    const closestY = Math.max(o.y, Math.min(entity.y, o.y + o.h));
    const dx = entity.x - closestX;
    const dy = entity.y - closestY;
    const dist = Math.hypot(dx, dy);
    if (dist < entity.r) {
      if (dist === 0) {
        const cx = o.x + o.w/2, cy = o.y + o.h/2;
        entity.x += (entity.x - cx) * 0.1;
        entity.y += (entity.y - cy) * 0.1;
      } else {
        const push = (entity.r - dist);
        entity.x += (dx / dist) * push;
        entity.y += (dy / dist) * push;
      }
    }
  }
}

// ===== PARTÍCULAS =====
function spawnHitParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 15, maxLife: 35,
      color, size: 2 + Math.random() * 3
    });
  }
}

// ===== POWER-UPS =====
const powerUps = [
  { name: "Vampírico", buff: "+15 vida máx e cura total", debuff: "-10% velocidade",
    apply: p => { p.maxHp += 15; p.hp = p.maxHp; p.speed *= 0.9; } },
  { name: "Velocidade", buff: "+25% velocidade", debuff: "-15 vida máxima",
    apply: p => { p.speed *= 1.25; p.maxHp -= 15; p.hp = Math.min(p.hp, p.maxHp); } },
  { name: "Bala Rápida", buff: "+40% velocidade projétil", debuff: "-10 vida máxima",
    apply: p => { p.bulletSpeed *= 1.4; p.maxHp -= 10; p.hp = Math.min(p.hp, p.maxHp); } },
  { name: "Carga Rápida", buff: "-30% kills pro especial", debuff: "-15 vida máxima",
    apply: p => { WEAPONS[p.weaponKey || 'pistol'].killCost = Math.max(3, WEAPONS[p.weaponKey || 'pistol'].killCost * 0.7); p.maxHp -= 15; } },
];

function showPowerUpChoice() {
  game.paused = true;
  const pool = [...powerUps].sort(() => Math.random() - 0.5).slice(0, 3);
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  pool.forEach(pu => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${pu.name}</h3>
      <div class="buff">▲ ${pu.buff}</div>
      <div class="debuff">▼ ${pu.debuff}</div>`;
    div.onclick = () => {
      pu.apply(game.player);
      document.getElementById('powerup').style.display = 'none';
      game.paused = false;
      game.wave++;
      if (game.wave % 5 === 0) changeBiome();
      startWave();
      canvas.focus();
    };
    cards.appendChild(div);
  });
  document.getElementById('powerup').style.display = 'flex';
}

// ===== ONDAS =====
function startWave() {
  game.waveEnemiesLeft = 3 + Math.floor(game.wave * 1.5);
  game.waveSpawning = true;
  game.spawnTimer = 0;
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const roll = Math.random();
  let type = 'basic';
  if (game.wave >= 3 && roll < 0.25) type = 'fast';
  if (game.wave >= 6 && roll > 0.85) type = 'tank';

  const base = {
    x, y, hp: 20 + game.wave * 3, r: 14,
    speed: 1.2 + game.wave * 0.05,
    color: '#f55', damage: 8, type,
    hitFlash: 0, wobble: Math.random() * Math.PI * 2,
  };
  if (type === 'fast') Object.assign(base, { speed: base.speed * 1.8, hp: base.hp * 0.6, r: 10, color: '#fa5' });
  else if (type === 'tank') Object.assign(base, { speed: base.speed * 0.6, hp: base.hp * 3, r: 20, color: '#a4f', damage: 15 });
  game.enemies.push(base);
}

// ===== TROCA DE ARMA =====
function switchWeapon(key) {
  if (!WEAPONS[key]) return;
  game.weapon = key;
  document.getElementById('weaponName').textContent = WEAPONS[key].name;
  game.screenFlash = 0.4;
}

// ===== ESPECIAL =====
function useSpecial() {
  const w = WEAPONS[game.weapon];
  if (game.killCharge < w.killCost) return;
  game.killCharge = 0;
  w.special(game.player, game);
  game.shake = 12;
  game.screenFlash = 0.7;
}

// ===== UPDATE =====
function update() {
  if (game.paused || game.gameOver) return;
  const p = game.player;
  const w = WEAPONS[game.weapon];

  if (game.shake > 0) game.shake *= 0.85;
  if (game.bgPulse > 0) game.bgPulse *= 0.92;
  if (game.screenFlash > 0) game.screenFlash *= 0.88;
  if (p.hitFlash > 0) p.hitFlash--;
  if (p.overdrive > 0) p.overdrive--;

  // Movimento
  let dx = 0, dy = 0;
  if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
  if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
  if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
  if (game.keys['d'] || game.keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + dx * p.speed));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + dy * p.speed));
  resolveCircleObstacles(p);

  // Tiro automático
  game.weaponCooldown--;
  if (game.weaponCooldown <= 0) {
    const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
    const count = w.bulletCount + (p.bulletCountBonus || 0);
    for (let i = 0; i < count; i++) {
      const spreadBase = (i - (count - 1) / 2) * 0.12;
      const randomSpread = (Math.random() - 0.5) * w.spread;
      const a = angle + spreadBase + randomSpread;
      game.bullets.push(makeBullet(p, a, w.bulletSpeed, w.bulletDamage, w.pierce));
    }
    // overdrive da SMG
    let rate = w.fireRate;
    if (p.overdrive > 0) rate = Math.max(2, w.fireRate * 0.3);
    game.weaponCooldown = rate;
  }

  // Spawn
  if (game.waveSpawning) {
    game.spawnTimer--;
    if (game.spawnTimer <= 0 && game.waveEnemiesLeft > 0) {
      spawnEnemy();
      game.waveEnemiesLeft--;
      game.spawnTimer = Math.max(8, 30 - game.wave);
    }
    if (game.waveEnemiesLeft <= 0) game.waveSpawning = false;
  }

  // Fim de onda
  if (!game.waveSpawning && game.enemies.length === 0) {
    if (game.wave % 10 === 0) {
      showPowerUpChoice();
    } else {
      game.wave++;
      if (game.wave % 5 === 0) changeBiome();
      // desbloqueia arma nova a cada 3 ondas
      if (game.wave === 3) switchWeapon('shotgun');
      else if (game.wave === 6) switchWeapon('smg');
      else if (game.wave === 9) switchWeapon('sniper');
      startWave();
    }
  }

  // Update balas
  game.bullets = game.bullets.filter(b => {
    b.life++;
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();
    b.x += b.vx; b.y += b.vy;

    // explosivo: some após 40 frames
    if (b.explosive && b.life > 40) {
      explode(b.x, b.y, b.radius, b.damage);
      return false;
    }

    for (const o of game.obstacles) {
      if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) {
        if (b.explosive) explode(b.x, b.y, b.radius, b.damage);
        spawnHitParticles(b.x, b.y, '#8af', 5);
        return false;
      }
    }
    return b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
  });

  // Update inimigos
  game.enemies.forEach(e => {
    if (e.hitFlash > 0) e.hitFlash--;
    e.wobble += 0.1;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const oldX = e.x, oldY = e.y;
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;
    resolveCircleObstacles(e);
    if (Math.hypot(e.x - oldX, e.y - oldY) < e.speed * 0.3) {
      e.x += Math.cos(a + Math.PI/2) * e.speed * 0.6;
      e.y += Math.sin(a + Math.PI/2) * e.speed * 0.6;
      resolveCircleObstacles(e);
    }
  });

  // Colisão bala x inimigo
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    let removed = false;
    for (let j = game.enemies.length - 1; j >= 0; j--) {
      const e = game.enemies[j];
      if (b.hit.includes(e)) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
        if (b.explosive) {
          explode(b.x, b.y, b.radius, b.damage);
          game.bullets.splice(i, 1);
          removed = true;
          break;
        }
        e.hp -= b.damage;
        e.hitFlash = 6;
        b.hit.push(e);
        spawnHitParticles(b.x, b.y, e.color, 6);
        if (e.hp <= 0) {
          spawnHitParticles(e.x, e.y, e.color, 14);
          game.enemies.splice(j, 1);
          game.score += 10 + game.wave;
          // CARREGA O ESPECIAL
          game.killCharge++;
          // solta a arma que estiver no inventário
        }
        if (b.pierce > 0) b.pierce--;
        else { game.bullets.splice(i, 1); removed = true; break; }
      }
    }
  }

  // Colisão jogador x inimigo
  game.enemies.forEach(e => {
    if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
      p.hp -= e.damage * 0.3;
      p.hitFlash = 8;
      game.shake = 6;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      e.x += Math.cos(a) * 5;
      e.y += Math.sin(a) * 5;
      resolveCircleObstacles(e);
    }
  });

  // Partículas
  game.particles = game.particles.filter(pt => {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life--;
    return pt.life > 0;
  });

  if (p.hp <= 0) game.gameOver = true;

  // HUD de arma
  const charged = game.killCharge >= w.killCost;
  const pct = Math.min(100, (game.killCharge / w.killCost) * 100);
  const bar = document.getElementById('specialBar');
  const fill = document.getElementById('specialFill');
  fill.style.width = pct + '%';
  bar.classList.toggle('ready', charged);
  document.getElementById('specialText').textContent =
    `${w.specialName}: ${Math.min(game.killCharge, w.killCost)}/${w.killCost} kills — ${w.specialDesc}${charged ? ' — [Q] PRONTO!' : ''}`;
}

// ===== EXPLOSÃO =====
function explode(x, y, radius, damage) {
  game.shake = 10;
  spawnHitParticles(x, y, '#fa5', 25);
  game.enemies.forEach(e => {
    if (Math.hypot(e.x - x, e.y - y) < radius) {
      e.hp -= damage;
      e.hitFlash = 8;
      if (e.hp <= 0) {
        spawnHitParticles(e.x, e.y, e.color, 12);
        game.score += 10 + game.wave;
        game.killCharge++;
      }
    }
  });
  // remove mortos
  game.enemies = game.enemies.filter(e => e.hp > 0);
  // efeito visual
  game.particles.push({
    x, y, vx: 0, vy: 0, life: 20, maxLife: 20,
    color: '#fa5', size: radius / 3, isExplosion: true, radius
  });
}

  }

  // fundo
  let bgColor = biome.bg;
  if (game.bgPulse > 0.05) bgColor = mixColors(biome.bg, '#ffffff', game.bgPulse * 0.6);
  ctx.fillStyle = bgColor;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // grid
  ctx.strokeStyle = biome.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    drawSprite('obstacle', o.x + o.w/2, o.y + o.h/2, Math.max(o.w, o.h), 0, () => {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(o.x + 4, o.y + 4, o.w, o.h);
