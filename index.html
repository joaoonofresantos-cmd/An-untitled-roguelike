<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ondas Infinitas</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#111; color:#eee; font-family:sans-serif; overflow:hidden; touch-action:none; }
  canvas {
    display: block; margin: auto; background: #1a1a2e; outline: none;
    touch-action: none; max-width: 100vw; max-height: 100vh;
  }
  #hud { position:absolute; top:10px; left:10px; font-size:16px; pointer-events:none; text-shadow:0 0 4px #000; z-index:5; }
  #specialHud {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none; text-shadow:0 0 4px #000; z-index:5;
  }
  #charName { font-size:18px; font-weight:bold; margin-bottom:4px; }
  #specialBar {
    width:300px; height:14px; background:#222; border:2px solid #444; border-radius:8px;
    overflow:hidden; position:relative;
  }
  #specialFill { height:100%; width:0%; background:linear-gradient(90deg,#4af,#8ff); transition:width 0.15s linear; }
  #specialBar.ready { border-color:#8ff; box-shadow:0 0 12px #4af; }
  #specialText { font-size:12px; margin-top:4px; color:#aaa; }

  #specialBtn {
    position:absolute; bottom:40px; right:30px; width:90px; height:90px;
    border-radius:50%; background:#222; border:3px solid #4af; color:#4af;
    font-size:36px; cursor:pointer; display:none; z-index:15;
    font-weight:bold; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  #specialBtn.ready { background:#4af; color:#fff; box-shadow:0 0 25px #4af; }
  #specialBtn:active { transform: scale(0.92); }

  #powerup {
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:10;
    padding:20px;
  }
  #powerup h2 { margin-bottom:20px; font-size:18px; text-align:center; }
  .card {
    background:#222; border:2px solid #444; padding:15px; margin:8px;
    width:400px; max-width:90vw; cursor:pointer; border-radius:8px; transition:0.2s;
  }
  .card:hover { border-color:#4af; background:#2a2a3e; }
  .card h3 { margin:0 0 8px; color:#4af; font-size:16px; }
  .buff { color:#6f6; font-size:13px; }
  .debuff { color:#f66; font-size:13px; }

  #selectScreen {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.95); z-index:20;
    padding: 20px;
  }
  #selectScreen h1 { margin-bottom:10px; color:#4af; font-size:24px; }
  #selectScreen p { color:#888; margin-bottom:20px; font-size:13px; }
  #charCards { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
  .charCard {
    background:#222; border:3px solid #444; border-radius:12px;
    padding:15px; width:220px; cursor:pointer; transition:0.2s; text-align:center;
  }
  .charCard:hover { transform:translateY(-6px); }
  .charCard h2 { margin:8px 0 4px; font-size:20px; }
  .charCard .role { font-size:11px; color:#888; margin-bottom:10px; }
  .charCard .stat { font-size:12px; color:#aaa; margin:3px 0; text-align:left; }
  .charCard .stat span { color:#fff; float:right; }
  .charCard .special { margin-top:10px; font-size:11px; color:#8ff; }

  @media (max-width: 700px) {
    #hud { font-size:12px; }
    #specialBar { width:200px; }
    .charCard { width:150px; padding:10px; }
    .charCard h2 { font-size:16px; }
    .card { width:90vw; padding:12px; }
    #specialBtn { width:70px; height:70px; font-size:28px; bottom:30px; right:20px; }
  }
</style>
</head>
<body>
<canvas id="game" width="900" height="600" tabindex="0"></canvas>
<div id="hud">
  <div>❤️ Vida: <span id="hp">100</span></div>
  <div>🏆 Score: <span id="score">0</span></div>
  <div>🌊 Onda: <span id="wave">1</span></div>
  <div>👾 Inimigos: <span id="enemies">0</span></div>
  <div>🌍 Bioma: <span id="biome">Planície</span></div>
</div>
<div id="specialHud">
  <div id="charName">—</div>
  <div id="specialBar"><div id="specialFill"></div></div>
  <div id="specialText">Especial: 0/0</div>
</div>
<button id="specialBtn">⚡</button>

<div id="selectScreen">
  <h1>Escolha seu personagem</h1>
  <p>Cada um tem um estilo único de jogo</p>
  <div id="charCards"></div>
</div>

<div id="powerup">
  <h2>Escolha um poder (e um preço...)</h2>
  <div id="cards"></div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ============================================================
// SPRITES
// ============================================================
const SPRITES = {
  sheriff: null, ninja: null, mago: null,
  enemyBasic: null, enemyFast: null, enemyTank: null,
  bullet: null, obstacle: null,
};

const SPRITE_CONFIG = {
  sheriff: { src: 'sprites/sheriff.png', frameW: 80, frameH: 80, frameCount: 3, fps: 5 },
  ninja:   { src: 'sprites/ninja.png',   frameW: 80, frameH: 80, frameCount: 3, fps: 8 },
  mago:    { src: 'sprites/mago.png',    frameW: 80, frameH: 80, frameCount: 3, fps: 4 },
};

function loadSprite(key, src, frameW, frameH, frameCount, fps) {
  const img = new Image();
  img.onload = () => {
    SPRITES[key] = img;
    SPRITE_CONFIG[key] = { src, frameW, frameH, frameCount, fps };
    console.log('Sprite carregado:', key);
  };
  img.onerror = () => console.warn('Sprite não encontrado (usando fallback):', src);
  img.src = src;
}

// loadSprite('sheriff', 'sprites/sheriff.png', 80, 80, 3, 5);
// loadSprite('ninja',   'sprites/ninja.png',   80, 80, 3, 8);
// loadSprite('mago',    'sprites/mago.png',    80, 80, 3, 4);

// ============================================================
// PERSONAGENS
// ============================================================
const CHARACTERS = {
  sheriff: {
    name: "Sheriff",
    role: "Longo alcance, ágil no gatilho",
    color: "#6f6", accentColor: "#afa",
    hp: 100, speed: 2.8,
    fireRate: 16, bulletSpeed: 11, bulletDamage: 14,
    bulletCount: 1, spread: 0.05, pierce: 0, bulletLife: 120,
    killCost: 8,
    specialName: "Rajada Dupla",
    specialDesc: "5 tiros rápidos em cone",
    special: (p, g) => {
      const a = Math.atan2(g.mouseY - p.y, g.mouseX - p.x);
      const c = CHARACTERS.sheriff;
      for (let i = 0; i < 5; i++) {
        g.bullets.push(makeBullet(p, a + (i - 2) * 0.12, 14, c.bulletDamage * 1.4, 1, 'special'));
      }
    }
  },
  ninja: {
    name: "Ninja",
    role: "Corpo a corpo, muito rápido",
    color: "#a4f", accentColor: "#d8f",
    hp: 9999, speed: 4.4,
    fireRate: 14, bulletSpeed: 8, bulletDamage: 22,
    bulletCount: 1, spread: 0, pierce: 0, bulletLife: 12,
    isMelee: true,
    killCost: 6,
    specialName: "Dash Cortante",
    specialDesc: "Avança rápido cortando tudo",
    special: (p, g) => {
      const a = Math.atan2(g.mouseY - p.y, g.mouseX - p.x);
      const dashDist = 140;
      const oldX = p.x, oldY = p.y;
      p.x = Math.max(p.r, Math.min(W - p.r, p.x + Math.cos(a) * dashDist));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y + Math.sin(a) * dashDist));
      resolveCircleObstacles(p);
      g.bullets.push({
        x: (oldX + p.x) / 2, y: (oldY + p.y) / 2,
        vx: 0, vy: 0, damage: 80, pierce: 999,
        hit: [], trail: [], angle: a,
        type: 'dash', life: 0, r: 80,
        isDashAoE: true, dashLife: 8,
      });
      p.hitFlash = 15;
      g.screenFlash = 0.6;
      g.shake = 10;
    }
  },
  mago: {
    name: "Mago",
    role: "Projétil teleguiado",
    color: "#4af", accentColor: "#8cf",
    hp: 90, speed: 3.0,
    fireRate: 30, bulletSpeed: 5, bulletDamage: 20,
    bulletCount: 1, spread: 0, pierce: 0, bulletLife: 200,
    homing: 0.08,
    killCost: 10,
    specialName: "Explosão Arcana",
    specialDesc: "Bola gigante que explode em área",
    special: (p, g) => {
      const a = Math.atan2(g.mouseY - p.y, g.mouseX - p.x);
      const b = makeBullet(p, a, 7, 60, 0, 'explosive');
      b.explosive = true; b.radius = 130; b.r = 10;
      b.homing = 0.05;
      g.bullets.push(b);
    }
  },
};

function makeBullet(p, angle, speed, damage, pierce, type) {
  return {
    x: p.x + Math.cos(angle) * 16,
    y: p.y + Math.sin(angle) * 16,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    damage, pierce, hit: [], trail: [], angle,
    type: type || 'normal',
    life: 0, r: 4, maxLife: 999,
  };
}

// ============================================================
// BIOMAS
// ============================================================
const BIOMES = [
  { name: "Planície", bg: "#1a1a2e", grid: "#252540", obstacleColor: "#4a4a6a", obstacleEdge: "#6a6a8a", obstacleCount: 4 },
  { name: "Caverna",  bg: "#1a1010", grid: "#2a1a1a", obstacleColor: "#5a3a2a", obstacleEdge: "#8a5a3a", obstacleCount: 7 },
  { name: "Gelo",     bg: "#0e1a24", grid: "#1a2e3e", obstacleColor: "#3a6a8a", obstacleEdge: "#6aaad0", obstacleCount: 5 },
  { name: "Vulcão",   bg: "#1a0a0a", grid: "#3a1515", obstacleColor: "#4a2020", obstacleEdge: "#a03a1a", obstacleCount: 6 },
  { name: "Ruínas",   bg: "#15151a", grid: "#2a2a35", obstacleColor: "#3a3a45", obstacleEdge: "#7a7a85", obstacleCount: 8 }
];

// ============================================================
// BOSSES
// ============================================================
const BOSSES = [
  {
    key: 'cavaleiro',
    name: "Cavaleiro Caído",
    color: '#e8e0d0', accentColor: '#a89878',
    r: 40,
    baseHp: 400,
    speed: 2.2,
    phases: [
      {
        name: 'Dash',
        duration: 90, telegraph: 30,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t === 0) {
            const a = Math.atan2(p.y - b.y, p.x - b.x);
            b.dashVx = Math.cos(a) * 12;
            b.dashVy = Math.sin(a) * 12;
          }
          if (t < 30) {
            b.x = Math.max(b.r, Math.min(W - b.r, b.x + b.dashVx));
            b.y = Math.max(b.r, Math.min(H - b.r, b.y + b.dashVy));
          }
        }
      },
      {
        name: 'Leque',
        duration: 80, telegraph: 40,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t % 20 === 0 && t < 60) {
            const baseA = Math.atan2(p.y - b.y, p.x - b.x);
            for (let i = -3; i <= 3; i++) {
              const a = baseA + i * 0.22;
              g.enemyBullets.push({
                x: b.x, y: b.y,
                vx: Math.cos(a) * 4, vy: Math.sin(a) * 4,
                r: 7, damage: 12, life: 200,
              });
            }
          }
        }
      },
      {
        name: 'Teleporte',
        duration: 70, telegraph: 25,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t === 0) {
            b.x = p.x < W/2 ? W - 100 : 100;
            b.y = p.y < H/2 ? H - 100 : 100;
            spawnHitParticles(b.x, b.y, b.accentColor, 20);
          }
          if (t > 20 && t < 50) {
            const a = Math.atan2(p.y - b.y, p.x - b.x);
            b.x += Math.cos(a) * 3.5;
            b.y += Math.sin(a) * 3.5;
          }
        }
      }
    ]
  },
  {
    key: 'feiticeira',
    name: "Feiticeira das Sombras",
    color: '#c060e0', accentColor: '#f0a0ff',
    r: 34,
    baseHp: 320,
    speed: 2.8,
    phases: [
      {
        name: 'Espiral',
        duration: 120, telegraph: 30,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t % 8 === 0) {
            const baseA = t * 0.15;
            for (let i = 0; i < 4; i++) {
              const a = baseA + i * Math.PI / 2;
              g.enemyBullets.push({
                x: b.x, y: b.y,
                vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5,
                r: 6, damage: 10, life: 250,
              });
            }
          }
        }
      },
      {
        name: 'Invocação',
        duration: 60, telegraph: 25,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t === 0) {
            for (let i = 0; i < 3; i++) {
              const a = (i / 3) * Math.PI * 2;
              spawnMinionAt(b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, g);
            }
            spawnHitParticles(b.x, b.y, b.accentColor, 30);
          }
        }
      },
      {
        name: 'Raio',
        duration: 100, telegraph: 50,
        update: (b, p, g, t, tele) => {
          if (tele) {
            b.hitFlash = 1;
            b.laserAngle = Math.atan2(p.y - b.y, p.x - b.x);
            return;
          }
          if (t === 0) {
            const a = b.laserAngle || 0;
            for (let d = 0; d < 600; d += 15) {
              g.enemyBullets.push({
                x: b.x + Math.cos(a) * d,
                y: b.y + Math.sin(a) * d,
                vx: Math.cos(a) * 8, vy: Math.sin(a) * 8,
                r: 9, damage: 14, life: 60,
              });
            }
            g.shake = 15;
          }
        }
      }
    ]
  },
  {
    key: 'devorador',
    name: "Devorador",
    color: '#e05030', accentColor: '#ffa060',
    r: 46,
    baseHp: 500,
    speed: 2.0,
    phases: [
      {
        name: 'Investida',
        duration: 100, telegraph: 35,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t === 0) {
            const a = Math.atan2(p.y - b.y, p.x - b.x);
            b.dashVx = Math.cos(a) * 10;
            b.dashVy = Math.sin(a) * 10;
          }
          if (t < 35) {
            b.x = Math.max(b.r, Math.min(W - b.r, b.x + b.dashVx));
            b.y = Math.max(b.r, Math.min(H - b.r, b.y + b.dashVy));
          }
        }
      },
      {
        name: 'Cuspe',
        duration: 90, telegraph: 30,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          if (t % 15 === 0) {
            const baseA = Math.atan2(p.y - b.y, p.x - b.x);
            for (let i = -4; i <= 4; i++) {
              const a = baseA + i * 0.18;
              const speed = 5 + Math.random() * 2;
              g.enemyBullets.push({
                x: b.x, y: b.y,
                vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,

              });
            }
          }
        }
      },
      {

        duration: 120, telegraph: 20,
        update: (b, p, g, t, tele) => {
          if (tele) { b.hitFlash = 1; return; }
          const a = Math.atan2(p.y - b.y, p.x - b.x);
          b.x += Math.cos(a) * 1.8;
          b.y += Math.sin(a) * 1.8;
        }
      }

function scaleBoss(baseBoss, wave) {
  const tier = Math.max(1, Math.floor(wave / 12));
  const mult = 1 + (tier - 1) * 0.6;
  return {
    ...baseBoss,
    hp: Math.round(baseBoss.baseHp * mult),
    maxHp: Math.round(baseBoss.baseHp * mult),
    speed: baseBoss.speed * (1 + (tier - 1) * 0.08),
    phases: baseBoss.phases.map(ph => ({ ...ph })),
  };
}

// ============================================================
// ESTADO
// ============================================================
let game;
let animTime = 0;

function initGame(charKey) {
  const c = CHARACTERS[charKey];
  game = {
    characterKey: charKey,
    player: {
      x: W/2, y: H/2, r: 12,
      hp: c.hp, maxHp: c.hp,
      speed: c.speed,
      fireCooldown: 0,
      hitFlash: 0,
      lifesteal: 0,
      damageMult: 1,
      fireRateMult: 1,
      missChance: 0,
      dodgeChance: 0,
    },
    bullets: [], enemies: [], particles: [], obstacles: [],
    enemyBullets: [],
    bossActive: null,
    bossDefeatedThisWave: false,
    keys: {},
    wave: 1, waveEnemiesLeft: 0, waveSpawning: false, spawnTimer: 0,
    score: 0,
    mouseX: W/2, mouseY: H/2 - 100,
    paused: false, gameOver: false,
    biomeIndex: 0,
    shake: 0, bgPulse: 0, screenFlash: 0,
    killCharge: 0,
  };
  generateObstacles();
  document.getElementById('charName').textContent = c.name;
  document.getElementById('charName').style.color = c.color;
}

function generateObstacles() {
  const biome = BIOMES[game.biomeIndex];
  game.obstacles = [];
  const margin = 80, centerSafe = 140;
  let attempts = 0;
  while (game.obstacles.length < biome.obstacleCount && attempts < 200) {
    attempts++;
    const w = 40 + Math.random() * 80;
    const h = 40 + Math.random() * 80;
    const x = margin + Math.random() * (W - margin*2 - w);
    const y = margin + Math.random() * (H - margin*2 - h);
    if (x < W/2 + centerSafe && x + w > W/2 - centerSafe &&
        y < H/2 + centerSafe && y + h > H/2 - centerSafe) continue;
    let overlap = false;
    for (const o of game.obstacles) {
      if (x < o.x + o.w + 30 && x + w + 30 > o.x &&
          y < o.y + o.h + 30 && y + h + 30 > o.y) { overlap = true; break; }
    }
    if (overlap) continue;
    game.obstacles.push({ x, y, w, h, color: biome.obstacleColor, edge: biome.obstacleEdge });
  }
}

function changeBiome() {
  game.biomeIndex = (game.biomeIndex + 1) % BIOMES.length;
  generateObstacles();
  game.bgPulse = 1;
  game.enemies.forEach(e => resolveCircleObstacles(e));
}

function resolveCircleObstacles(entity) {
  for (const o of game.obstacles) {
    const closestX = Math.max(o.x, Math.min(entity.x, o.x + o.w));
    const closestY = Math.max(o.y, Math.min(entity.y, o.y + o.h));
    const dx = entity.x - closestX;
    const dy = entity.y - closestY;
    const dist = Math.hypot(dx, dy);
    if (dist < entity.r) {
      if (dist === 0) {
        const cx = o.x + o.w/2, cy = o.y + o.h/2;
        entity.x += (entity.x - cx) * 0.1;
        entity.y += (entity.y - cy) * 0.1;
      } else {
        const push = (entity.r - dist);
        entity.x += (dx / dist) * push;
        entity.y += (dy / dist) * push;
      }
    }
  }
}

function spawnHitParticles(x, y, color, count) {
  count = count || 6;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 15, maxLife: 35,
      color, size: 2 + Math.random() * 3
    });
  }
}

function drawAnimatedSprite(key, x, y, size, fallbackFn) {
  const img = SPRITES[key];
  const cfg = SPRITE_CONFIG[key];
  if (!img || !cfg || !cfg.frameCount) { fallbackFn(); return; }
  const totalFrames = cfg.frameCount;
  const currentFrame = Math.floor(animTime * cfg.fps / 60) % totalFrames;
  const sx = currentFrame * cfg.frameW;
  ctx.save();
  ctx.translate(x, y);
  ctx.drawImage(img, sx, 0, cfg.frameW, cfg.frameH, -size/2, -size/2, size, size);
  ctx.restore();
}

// ============================================================
// POWER-UPS
// ============================================================
const powerUps = [
  { name: "Vampírico", buff: "+8% lifesteal (cura ao causar dano)", debuff: "-15% dano",
    apply: p => { p.lifesteal += 0.08; p.damageMult *= 0.85; } },
  { name: "Velocidade", buff: "+25% velocidade", debuff: "-15 vida máxima",
    apply: p => { p.speed *= 1.25; p.maxHp -= 15; p.hp = Math.min(p.hp, p.maxHp); } },
  { name: "Cura", buff: "Recupera 60 de vida", debuff: "-5 vida máxima",
    apply: p => { p.hp = Math.min(p.maxHp, p.hp + 60); p.maxHp -= 5; } },
  { name: "Fúria", buff: "+30% velocidade de ataque", debuff: "-20% dano",
    apply: p => { p.fireRateMult *= 0.7; p.damageMult *= 0.8; } },
  { name: "Couraça", buff: "+25 vida máxima", debuff: "-10% velocidade",

  { name: "Ímã", buff: "+40% raio de coleta pro especial", debuff: "-8 vida máxima",
    apply: p => { p.killRadiusBonus = (p.killRadiusBonus || 0) + 0.4; p.maxHp -= 8; } },
  { name: "Precisão", buff: "+25% dano", debuff: "10% chance de errar",
    apply: p => { p.damageMult *= 1.25; p.missChance += 0.1; } },
  { name: "Fantasma", buff: "+5% chance de esquiva", debuff: "-10 vida máxima",
    apply: p => { p.dodgeChance += 0.05; p.maxHp -= 10; } },
];

function showPowerUpChoice() {
  game.paused = true;
  const pool = [...powerUps].sort(() => Math.random() - 0.5).slice(0, 3);
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  pool.forEach(pu => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<h3>' + pu.name + '</h3>' +
      '<div class="buff">▲ ' + pu.buff + '</div>' +
      '<div class="debuff">▼ ' + pu.debuff + '</div>';
    div.onclick = () => {
      pu.apply(game.player);
      document.getElementById('powerup').style.display = 'none';
      game.paused = false;
      game.wave++;
      if (game.wave % 5 === 0) changeBiome();
      startWave();
      canvas.focus();
    };
    cards.appendChild(div);
  });
  document.getElementById('powerup').style.display = 'flex';
}

// ============================================================
// ONDAS
// ============================================================
function startWave() {
  game.waveEnemiesLeft = 3 + Math.floor(game.wave * 1.5);
  game.waveSpawning = true;
  game.spawnTimer = 0;
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -30; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + 30; }
  else { x = -30; y = Math.random() * H; }

  const roll = Math.random();
  let type = 'basic';
  if (game.wave >= 3 && roll < 0.15) type = 'fast';
  if (game.wave >= 6 && roll > 0.90) type = 'tank';
  if (game.wave >= 4 && roll >= 0.50 && roll < 0.60) type = 'stalker';
  if (game.wave >= 5 && roll >= 0.60 && roll < 0.68) type = 'swarm';
  if (game.wave >= 7 && roll >= 0.68 && roll < 0.78) type = 'shooter';
  if (game.wave >= 8 && roll >= 0.78 && roll < 0.85) type = 'bomber';

  const base = {
    x, y, hp: 20 + game.wave * 3, r: 14,
    speed: 1.2 + game.wave * 0.05,
    color: '#f55', damage: 8, type,
    hitFlash: 0, wobble: Math.random() * Math.PI * 2,
  };

  if (type === 'fast') {
    Object.assign(base, { speed: base.speed * 1.8, hp: base.hp * 0.6, r: 10, color: '#fa5' });
  } else if (type === 'tank') {
    Object.assign(base, { speed: base.speed * 0.6, hp: base.hp * 3, r: 20, color: '#a4f', damage: 15 });
  } else if (type === 'stalker') {
    Object.assign(base, {
      speed: base.speed * 1.1, hp: base.hp * 1.5, r: 13, color: '#3a3a5a', damage: 18,
      stalkState: 'hiding', hideTarget: null, attackRange: 180, hidden: true,
    });
  } else if (type === 'swarm') {
    Object.assign(base, { speed: base.speed * 2.2, hp: base.hp * 0.25, r: 7, color: '#f0a', damage: 4 });
  } else if (type === 'shooter') {
    Object.assign(base, {
      speed: base.speed * 0.7, hp: base.hp * 0.9, r: 12, color: '#fa5', damage: 6,
      shootCooldown: 60 + Math.random() * 30,
    });
  } else if (type === 'bomber') {
    Object.assign(base, {
      speed: base.speed * 1.4, hp: base.hp * 0.7, r: 14, color: '#f80', damage: 0, fuse: -1,
    });
  }

  game.enemies.push(base);
}

function spawnBoss() {
  const tier = Math.max(1, Math.floor(game.wave / 12));
  const baseBoss = BOSSES[(tier - 1) % BOSSES.length];
  const boss = scaleBoss(baseBoss, game.wave);

  const b = {
    ...boss,
    x: W / 2, y: 100,
    phaseIndex: 0, phaseTime: 0,
    hitFlash: 0, wobble: 0,
    isBoss: true,
    dashVx: 0, dashVy: 0,
  };

  game.bossActive = b;
  game.enemies.push(b);
  game.shake = 20;
  game.screenFlash = 1;
}

function spawnMinionAt(x, y, g) {
  g.enemies.push({
    x, y,
    hp: 15 + g.wave * 2, r: 8,
    speed: 1.8 + g.wave * 0.03,
    color: '#ff40a0', damage: 6, type: 'minion',
    hitFlash: 0, wobble: Math.random() * Math.PI * 2,
  });
}

// ============================================================
// ESPECIAL
// ============================================================
function useSpecial() {
  if (!game || game.paused || game.gameOver) return;
  const c = CHARACTERS[game.characterKey];
  if (game.killCharge < c.killCost) return;
  game.killCharge = 0;
  c.special(game.player, game);
  game.shake = 12;
  game.screenFlash = 0.7;
  updateSpecialBtn();
}

function updateSpecialBtn() {
  const btn = document.getElementById('specialBtn');
  if (!btn || !game) return;
  const c = CHARACTERS[game.characterKey];
  btn.classList.toggle('ready', game.killCharge >= c.killCost);
}

// ============================================================
// EXPLOSÃO
// ============================================================
function explode(x, y, radius, damage) {
  game.shake = 10;
  spawnHitParticles(x, y, '#fa5', 25);
  game.enemies.forEach(e => {
    if (Math.hypot(e.x - x, e.y - y) < radius) {
      e.hp -= damage;
      e.hitFlash = 8;
    }
  });
  game.enemies = game.enemies.filter(e => {
    if (e.hp <= 0) {
      if (e.isBoss) {
        game.score += 500 + game.wave * 20;
        game.killCharge += 20;
      } else {
        game.score += 10 + game.wave;
        game.killCharge++;
      }
      spawnHitParticles(e.x, e.y, e.color, 12);
      return false;
    }
    return true;
  });
  game.particles.push({
    x, y, vx: 0, vy: 0, life: 20, maxLife: 20,
    color: '#fa5', size: radius / 3, isExplosion: true, radius
  });
}

// ============================================================
// TOUCH
// ============================================================
const touchState = {
  moveId: null, moveOriginX: 0, moveOriginY: 0, moveCurrentX: 0, moveCurrentY: 0,
  aimId: null, aimX: 0, aimY: 0,
};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!game || game.paused || game.gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  for (const touch of e.changedTouches) {
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    if (x < W / 2 && touchState.moveId === null) {
      touchState.moveId = touch.identifier;
      touchState.moveOriginX = x; touchState.moveOriginY = y;
      touchState.moveCurrentX = x; touchState.moveCurrentY = y;
    } else if (x >= W / 2 && touchState.aimId === null) {
      touchState.aimId = touch.identifier;
      touchState.aimX = x; touchState.aimY = y;
      game.mouseX = x; game.mouseY = y;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  for (const touch of e.changedTouches) {
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    if (touch.identifier === touchState.moveId) {
      touchState.moveCurrentX = x; touchState.moveCurrentY = y;
    } else if (touch.identifier === touchState.aimId) {
      touchState.aimX = x; touchState.aimY = y;
      game.mouseX = x; game.mouseY = y;
    }
  }
}, { passive: false });

function endTouch(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchState.moveId) touchState.moveId = null;
    if (touch.identifier === touchState.aimId) touchState.aimId = null;
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

// ============================================================
// UPDATE
// ============================================================
function update() {
  if (!game || game.paused || game.gameOver) return;
  animTime++;
  const p = game.player;
  const c = CHARACTERS[game.characterKey];

  if (game.shake > 0) game.shake *= 0.85;
  if (game.bgPulse > 0) game.bgPulse *= 0.92;
  if (game.screenFlash > 0) game.screenFlash *= 0.88;
  if (p.hitFlash > 0) p.hitFlash--;

  // Movimento
  let dx = 0, dy = 0;
  if (game.keys['w'] || game.keys['arrowup']) dy -= 1;
  if (game.keys['s'] || game.keys['arrowdown']) dy += 1;
  if (game.keys['a'] || game.keys['arrowleft']) dx -= 1;
  if (game.keys['d'] || game.keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy);
  if (len > 0) { dx /= len; dy /= len; }
  p.x += dx * p.speed;
  p.y += dy * p.speed;

  if (touchState.moveId !== null) {
    const dxT = touchState.moveCurrentX - touchState.moveOriginX;
    const dyT = touchState.moveCurrentY - touchState.moveOriginY;
    const distT = Math.hypot(dxT, dyT);
    if (distT > 8) {
      const norm = Math.min(distT, 60) / 60;
      p.x += (dxT / distT) * norm * p.speed;
      p.y += (dyT / distT) * norm * p.speed;
    }
  }

  p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y));
  resolveCircleObstacles(p);

  // Tiro
  p.fireCooldown--;
  if (p.fireCooldown <= 0) {
    const angle = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);
    let finalAngle = angle;
    if (p.missChance && Math.random() < p.missChance) {
      finalAngle += (Math.random() - 0.5) * 0.8;
    }

    if (c.isMelee) {
      const slashX = p.x + Math.cos(finalAngle) * 55;
      const slashY = p.y + Math.sin(finalAngle) * 55;
      let blocked = false;
      for (let tt = 0.3; tt <= 1; tt += 0.35) {
        const cx = p.x + Math.cos(finalAngle) * 55 * tt;
        const cy = p.y + Math.sin(finalAngle) * 55 * tt;
        for (const o of game.obstacles) {
          if (cx > o.x && cx < o.x + o.w && cy > o.y && cy < o.y + o.h) { blocked = true; break; }
        }
        if (blocked) break;
      }
      if (!blocked) {
        game.bullets.push({
          x: slashX, y: slashY,
          vx: 0, vy: 0,
          damage: c.bulletDamage * p.damageMult,
          pierce: 999,
          hit: [], trail: [], angle: finalAngle,
          type: 'slash', life: 0, maxLife: 10,
          r: 55, w: 100, h: 40, isSlash: true,
        });
      }
    } else {
      const count = c.bulletCount;
      for (let i = 0; i < count; i++) {
        const spreadBase = (i - (count - 1) / 2) * 0.12;
        const randomSpread = (Math.random() - 0.5) * c.spread;
        const a = finalAngle + spreadBase + randomSpread;
        const b = makeBullet(p, a, c.bulletSpeed, c.bulletDamage * p.damageMult, c.pierce);
        b.maxLife = c.bulletLife;
        if (c.homing) b.homing = c.homing;
        game.bullets.push(b);
      }
    }
    p.fireCooldown = c.fireRate * p.fireRateMult;
  }

  // Spawn
  if (game.waveSpawning) {
    game.spawnTimer--;
    if (game.spawnTimer <= 0 && game.waveEnemiesLeft > 0) {
      spawnEnemy();
      game.waveEnemiesLeft--;
      game.spawnTimer = Math.max(8, 30 - game.wave);
    }
    if (game.waveEnemiesLeft <= 0) game.waveSpawning = false;
  }

  // Boss morto?
  if (game.bossActive && game.enemies.indexOf(game.bossActive) === -1) {
    game.bossActive = null;
    game.bossDefeatedThisWave = false;
    game.shake = 25;
    game.screenFlash = 1;
  }

  // Fim de onda
  if (!game.waveSpawning && game.enemies.length === 0) {
    if (game.wave % 12 === 0 && !game.bossDefeatedThisWave) {
      spawnBoss();
      game.bossDefeatedThisWave = true;
      return;
    }
    if (game.wave % 10 === 0) {
      showPowerUpChoice();
    } else {
      game.wave++;
      game.bossDefeatedThisWave = false;
      if (game.wave % 5 === 0) changeBiome();
      startWave();
    }
  }

  // Balas do player
  game.bullets = game.bullets.filter(b => {
    b.life++;

    if (b.isSlash) {
      if (b.life >= b.maxLife) return false;
      for (let k = game.enemies.length - 1; k >= 0; k--) {
        const e = game.enemies[k];
        if (b.hit.indexOf(e) === -1 && Math.hypot(e.x - b.x, e.y - b.y) < b.r + e.r) {
          e.hp -= b.damage; e.hitFlash = 6; b.hit.push(e);
          if (p.lifesteal > 0) p.hp = Math.min(p.maxHp, p.hp + b.damage * p.lifesteal);
          spawnHitParticles(e.x, e.y, e.color, 8);
          if (e.hp <= 0) {
            if (e.isBoss) { game.score += 500 + game.wave * 20; game.killCharge += 20; }
            else { game.score += 10 + game.wave; game.killCharge++; }
            spawnHitParticles(e.x, e.y, e.color, 14);
            game.enemies.splice(k, 1);
          }
        }
      }
      return true;
    }

    if (b.isDashAoE) {
      b.dashLife--;
      if (b.dashLife <= 0) return false;
      for (let k = game.enemies.length - 1; k >= 0; k--) {
        const e = game.enemies[k];
        if (b.hit.indexOf(e) === -1 && Math.hypot(e.x - b.x, e.y - b.y) < b.r) {
          e.hp -= b.damage; e.hitFlash = 6; b.hit.push(e);
          if (p.lifesteal > 0) p.hp = Math.min(p.maxHp, p.hp + b.damage * p.lifesteal);
          spawnHitParticles(e.x, e.y, e.color, 8);
          if (e.hp <= 0) {
            if (e.isBoss) { game.score += 500 + game.wave * 20; game.killCharge += 20; }
            else { game.score += 10 + game.wave; game.killCharge++; }
            spawnHitParticles(e.x, e.y, e.color, 14);
            game.enemies.splice(k, 1);
          }
        }
      }
      return true;
    }

    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 6) b.trail.shift();

    if (b.homing && game.enemies.length > 0) {
      let closest = null, closestDist = Infinity;
      for (const e of game.enemies) {
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < closestDist && d < 250) { closest = e; closestDist = d; }
      }
      if (closest) {
        const ta = Math.atan2(closest.y - b.y, closest.x - b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let diff = ta - ca;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const na = ca + diff * b.homing;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
        b.angle = na;
      }
    }

    b.x += b.vx; b.y += b.vy;

    if (b.explosive && b.life > 40) {
      explode(b.x, b.y, b.radius, b.damage);
      return false;
    }
    if (b.life > b.maxLife) return false;

    for (const o of game.obstacles) {
      if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) {
        if (b.explosive) explode(b.x, b.y, b.radius, b.damage);
        spawnHitParticles(b.x, b.y, '#8af', 5);
        return false;
      }
    }
    return b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
  });

  // Balas dos inimigos
  game.enemyBullets = game.enemyBullets.filter(eb => {
    eb.x += eb.vx;
    eb.y += eb.vy;
    eb.life--;
    if (eb.life <= 0) return false;
    if (eb.x < -30 || eb.x > W + 30 || eb.y < -30 || eb.y > H + 30) return false;

    if (p.hitFlash === 0 && Math.hypot(eb.x - p.x, eb.y - p.y) < p.r + eb.r) {
      // Chance de esquivar
      if (p.dodgeChance && Math.random() < p.dodgeChance) {
        spawnHitParticles(eb.x, eb.y, '#8ff', 6);
        return false;
      }
      p.hp -= eb.damage;
      p.hitFlash = 8;
      game.shake = 8;
      spawnHitParticles(eb.x, eb.y, '#f66', 8);
      return false;
    }
    for (const o of game.obstacles) {
      if (eb.x > o.x && eb.x < o.x + o.w && eb.y > o.y && eb.y < o.y + o.h) {
        spawnHitParticles(eb.x, eb.y, '#f66', 4);
        return false;
      }
    }
    return true;
  });

  // Inimigos
  game.enemies.forEach(e => {
    if (e.hitFlash > 0 && !e.isBoss) e.hitFlash--;
    e.wobble += 0.1;

    // BOSS
    if (e.isBoss) {
      const phase = e.phases[e.phaseIndex];
      e.phaseTime++;
      const tele = e.phaseTime <= phase.telegraph;
      const t = e.phaseTime - phase.telegraph;
      phase.update(e, p, game, Math.max(0, t), tele);
      if (e.phaseTime >= phase.duration + phase.telegraph) {
        e.phaseIndex = (e.phaseIndex + 1) % e.phases.length;
        e.phaseTime = 0;
        const a = Math.random() * Math.PI * 2;
        e.x += Math.cos(a) * 30;
        e.y += Math.sin(a) * 30;
      }
      // Colisão com player (dano de contato do boss)
      if (p.hitFlash === 0 && Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
        p.hp -= 20;
        p.hitFlash = 12;
        game.shake = 15;
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        p.x += Math.cos(a) * 30;
        p.y += Math.sin(a) * 30;
      }
      return;
    }

    // STALKER
    if (e.type === 'stalker') {
      const dP = Math.hypot(p.x - e.x, p.y - e.y);
      if (e.stalkState === 'hiding' && dP < e.attackRange) {
        e.stalkState = 'attacking'; e.hidden = false; e.speed *= 1.6;
        spawnHitParticles(e.x, e.y, '#f0f', 10);
      }
      if (e.stalkState === 'attacking' && dP > e.attackRange * 2.5) {
        e.stalkState = 'hiding'; e.hidden = true; e.speed /= 1.6; e.hideTarget = null;
      }
      if (e.stalkState === 'attacking') {
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        e.x += Math.cos(a) * e.speed; e.y += Math.sin(a) * e.speed;
        resolveCircleObstacles(e);
      } else {
        if (!e.hideTarget) {
          let best = null, bestDist = Infinity;
          for (const o of game.obstacles) {
            const ox = o.x + o.w / 2, oy = o.y + o.h / 2;
            const ang = Math.atan2(oy - p.y, ox - p.x);
            const hx = ox + Math.cos(ang) * (Math.max(o.w, o.h) * 0.6 + 25);
            const hy = oy + Math.sin(ang) * (Math.max(o.w, o.h) * 0.6 + 25);
            const d = Math.hypot(hx - e.x, hy - e.y);
            if (d < bestDist) { bestDist = d; best = { x: hx, y: hy }; }
          }
          e.hideTarget = best;
        }
        if (e.hideTarget) {
          const a = Math.atan2(e.hideTarget.y - e.y, e.hideTarget.x - e.x);
          const dH = Math.hypot(e.hideTarget.x - e.x, e.hideTarget.y - e.y);
          if (dH < 8) e.hideTarget = null;
          else {
            e.x += Math.cos(a) * e.speed * 0.8;
            e.y += Math.sin(a) * e.speed * 0.8;
            resolveCircleObstacles(e);
          }
        }
      }
      return;
    }

    // SHOOTER
    if (e.type === 'shooter') {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      const dP = Math.hypot(p.x - e.x, p.y - e.y);
      if (dP > 250) { e.x += Math.cos(a) * e.speed; e.y += Math.sin(a) * e.speed; }
      else if (dP < 180) { e.x -= Math.cos(a) * e.speed * 0.6; e.y -= Math.sin(a) * e.speed * 0.6; }
      resolveCircleObstacles(e);
      e.shootCooldown--;
      if (e.shootCooldown <= 0 && dP < 400) {
        game.enemyBullets.push({
          x: e.x, y: e.y,
          vx: Math.cos(a) * 4, vy: Math.sin(a) * 4,
          r: 6, damage: 10, life: 200,
        });
        e.shootCooldown = 90;
      }
      return;
    }

    // BOMBER
    if (e.type === 'bomber') {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      const dP = Math.hypot(p.x - e.x, p.y - e.y);
      e.x += Math.cos(a) * e.speed; e.y += Math.sin(a) * e.speed;
      resolveCircleObstacles(e);
      if (e.fuse === -1 && dP < 100) e.fuse = 45;
      if (e.fuse > 0) {
        e.fuse--;
        e.color = e.fuse % 6 < 3 ? '#fff' : '#f80';
        if (e.fuse === 0) {
          spawnHitParticles(e.x, e.y, '#f80', 30);
          if (Math.hypot(p.x - e.x, p.y - e.y) < 120) {
            if (!(p.dodgeChance && Math.random() < p.dodgeChance)) {
              p.hp -= 25; p.hitFlash = 10;
            }
          }
          game.shake = 12;
          game.enemies.splice(game.enemies.indexOf(e), 1);
          return;
        }
      }
      return;
    }

    // IA padrão
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const oldX = e.x, oldY = e.y;
    e.x += Math.cos(a) * e.speed;
    e.y += Math.sin(a) * e.speed;
    resolveCircleObstacles(e);
    if (Math.hypot(e.x - oldX, e.y - oldY) < e.speed * 0.3) {
      e.x += Math.cos(a + Math.PI/2) * e.speed * 0.6;
      e.y += Math.sin(a + Math.PI/2) * e.speed * 0.6;
      resolveCircleObstacles(e);
    }
  });

  // Bala x inimigo
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (b.isDashAoE || b.isSlash) continue;
    for (let j = game.enemies.length - 1; j >= 0; j--) {
      const e = game.enemies[j];
      if (b.hit.indexOf(e) !== -1) continue;
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
        if (b.explosive) {
          explode(b.x, b.y, b.radius, b.damage);
          game.bullets.splice(i, 1);
          break;
        }
        e.hp -= b.damage; e.hitFlash = 6; b.hit.push(e);
        if (p.lifesteal > 0) p.hp = Math.min(p.maxHp, p.hp + b.damage * p.lifesteal);
        spawnHitParticles(b.x, b.y, e.color, 6);
        if (e.hp <= 0) {
          if (e.isBoss) { game.score += 500 + game.wave * 20; game.killCharge += 20; }
          else { game.score += 10 + game.wave; game.killCharge++; }
          spawnHitParticles(e.x, e.y, e.color, 14);
          game.enemies.splice(j, 1);
        }
        if (b.pierce > 0) b.pierce--;
        else { game.bullets.splice(i, 1); break; }
      }
    }
  }

  // Jogador x inimigo
  if (p.hitFlash === 0) {
    game.enemies.forEach(e => {
      if (e.isBoss) return;
      if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) {
        if (p.dodgeChance && Math.random() < p.dodgeChance) return;
        p.hp -= e.damage * 0.3;
        p.hitFlash = 8;
        game.shake = 6;
        const a = Math.atan2(e.y - p.y, e.x - p.x);
        e.x += Math.cos(a) * 5;
        e.y += Math.sin(a) * 5;
        resolveCircleObstacles(e);
      }
    });
  }

  // Partículas
  game.particles = game.particles.filter(pt => {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vx *= 0.94; pt.vy *= 0.94;
    pt.life--;
    return pt.life > 0;
  });

  if (p.hp <= 0) game.gameOver = true;

  // HUD
  const charged = game.killCharge >= c.killCost;
  const pct = Math.min(100, (game.killCharge / c.killCost) * 100);
  document.getElementById('specialFill').style.width = pct + '%';
  document.getElementById('specialBar').classList.toggle('ready', charged);
  document.getElementById('specialText').textContent =
    c.specialName + ': ' + Math.min(game.killCharge, c.killCost) + '/' + c.killCost +
    (charged ? ' — ' + (isTouch ? 'TOQUE ⚡' : '[Q] PRONTO!') : '');
  updateSpecialBtn();
}

// ============================================================
// RENDER
// ============================================================
function draw() {
  if (!game) return;
  const biome = BIOMES[game.biomeIndex];
  const p = game.player;
  const c = CHARACTERS[game.characterKey];
  const a = Math.atan2(game.mouseY - p.y, game.mouseX - p.x);

  ctx.save();
  if (game.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }

  let bgColor = biome.bg;
  if (game.bgPulse > 0.05) bgColor = mixColors(biome.bg, '#ffffff', game.bgPulse * 0.6);
  ctx.fillStyle = bgColor;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  ctx.strokeStyle = biome.grid;
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  game.obstacles.forEach(o => {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(o.x + 4, o.y + 4, o.w, o.h);
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = o.edge;
    ctx.fillRect(o.x, o.y, o.w, 3);
    ctx.fillRect(o.x, o.y, 3, o.h);
  });

  game.particles.forEach(pt => {
    const alpha = pt.life / pt.maxLife;
    ctx.globalAlpha = alpha;
    if (pt.isExplosion) {
      ctx.strokeStyle = '#fa5'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius * (1 - alpha), 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * alpha, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  // Balas do player
  game.bullets.forEach(b => {
    if (b.isSlash) {
      const alpha = 1 - (b.life / b.maxLife);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.globalAlpha = alpha;
      const grad = ctx.createLinearGradient(-b.w/2, 0, b.w/2, 0);
      grad.addColorStop(0, 'rgba(180,140,255,0)');
      grad.addColorStop(0.5, 'rgba(220,180,255,0.9)');
      grad.addColorStop(1, 'rgba(180,140,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-b.w/2, 0); ctx.lineTo(b.w/2, 0); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    }
    if (b.isDashAoE) {
      const alpha = b.dashLife / 8;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(180,140,255,0.4)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    for (let i = 0; i < b.trail.length; i++) {
      const t = b.trail[i];
      const alpha = (i / b.trail.length) * 0.7;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = b.explosive ? '#fa5' : c.color;
      ctx.beginPath(); ctx.arc(t.x, t.y, 2 + i * 0.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    let coreColor = c.accentColor;
    if (b.type === 'special') coreColor = '#ff8';
    if (b.type === 'explosive') coreColor = '#fa5';
    ctx.fillStyle = coreColor;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = b.explosive ? 'rgba(255,170,80,0.4)' : 'rgba(150,200,255,0.3)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, Math.PI*2); ctx.fill();
  });

  // Balas dos inimigos
  game.enemyBullets.forEach(eb => {
    ctx.fillStyle = '#f66';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,100,100,0.4)';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r * 0.4, 0, Math.PI*2); ctx.fill();
  });

  // Inimigos
  game.enemies.forEach(e => {
    // BOSS
    if (e.isBoss) {
      const phase = e.phases[e.phaseIndex];
      const tele = e.phaseTime <= phase.telegraph;
      if (tele) {
        ctx.globalAlpha = 0.3 + Math.sin(e.phaseTime * 0.6) * 0.3;
        ctx.fillStyle = '#f00';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 25, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(e.x + 4, e.y + 5, e.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = (e.hitFlash > 0 && tele) ? '#fff' : e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = e.accentColor; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI*2); ctx.stroke();
      const pulse = 1 + Math.sin(e.wobble) * 0.15;
      ctx.fillStyle = e.accentColor;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.4 * pulse, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      const ea = Math.atan2(p.y - e.y, p.x - e.x);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(e.x + Math.cos(ea - 0.5) * e.r * 0.5, e.y + Math.sin(ea - 0.5) * e.r * 0.5, e.r * 0.15, 0, Math.PI*2);
      ctx.arc(e.x + Math.cos(ea + 0.5) * e.r * 0.5, e.y + Math.sin(ea + 0.5) * e.r * 0.5, e.r * 0.15, 0, Math.PI*2);
      ctx.fill();
      // Barra de vida gigante
      const barW = W - 100, barX = 50, barY = 30;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(barX - 3, barY - 3, barW + 6, 26);
      ctx.fillStyle = '#2a0a0a';
      ctx.fillRect(barX, barY, barW, 20);
      const hpPct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = '#e03030';
      ctx.fillRect(barX, barY, barW * hpPct, 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.name + ' — Fase: ' + phase.name, W/2, barY + 15);
      return;
    }

    const isStalkerHidden = (e.type === 'stalker' && e.hidden);
    ctx.globalAlpha = isStalkerHidden ? 0.35 : 1;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(e.x + 3, e.y + 3, e.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();

    if (e.type === 'stalker') {
      ctx.strokeStyle = e.hidden ? '#f0f' : '#f00';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2, 0, Math.PI*2); ctx.stroke();
    }
    if (e.type === 'bomber' && e.fuse > 0) {
      ctx.strokeStyle = e.fuse % 6 < 3 ? '#fff' : '#f80';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, Math.PI*2); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    const pulse = 1 + Math.sin(e.wobble) * 0.08;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * pulse, 0, Math.PI*2); ctx.stroke();

    const ea = Math.atan2(p.y - e.y, p.x - e.x);
    ctx.fillStyle = e.type === 'stalker' ? (e.hidden ? '#f0f' : '#f00') : '#000';
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(ea - 0.4) * e.r * 0.4, e.y + Math.sin(ea - 0.4) * e.r * 0.4, e.r * 0.18, 0, Math.PI*2);
    ctx.arc(e.x + Math.cos(ea + 0.4) * e.r * 0.4, e.y + Math.sin(ea + 0.4) * e.r * 0.4, e.r * 0.18, 0, Math.PI*2);
    ctx.fill();

    const hpPct = Math.max(0, e.hp / (20 + game.wave * 3));
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 4);
    ctx.fillStyle = '#f66';
    ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * hpPct, 4);

    ctx.globalAlpha = 1;
  });

  // Jogador
  drawAnimatedSprite(game.characterKey, p.x, p.y, p.r * 3, () => {
    const pColor = p.hitFlash > 0 ? '#fff' : c.color;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.arc(p.x + 2, p.y + 3, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = pColor;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = c.accentColor; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(a) * 20, p.y + Math.sin(a) * 20); ctx.stroke();
  });

  // Joystick
  if (touchState.moveId !== null) {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(touchState.moveOriginX, touchState.moveOriginY, 60, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#4af';
    const jdx = touchState.moveCurrentX - touchState.moveOriginX;
    const jdy = touchState.moveCurrentY - touchState.moveOriginY;
    const jd = Math.hypot(jdx, jdy);
    const maxR = 60;
    const nx = jd > maxR ? (jdx / jd) * maxR : jdx;
    const ny = jd > maxR ? (jdy / jd) * maxR : jdy;
    ctx.beginPath(); ctx.arc(touchState.moveOriginX + nx, touchState.moveOriginY + ny, 25, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (game.screenFlash > 0.02) {
    ctx.fillStyle = 'rgba(255,255,255,' + (game.screenFlash * 0.4) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  if (game.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f66';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('VOCÊ MORREU', W/2, H/2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText('Score: ' + game.score + ' | Onda: ' + game.wave, W/2, H/2 + 30);
    ctx.fillText(isTouch ? 'Toque para reiniciar' : 'Pressione ENTER para reiniciar', W/2, H/2 + 70);
  }

  document.getElementById('hp').textContent = Math.max(0, Math.floor(p.hp)) + '/' + p.maxHp;
  document.getElementById('score').textContent = game.score;
  document.getElementById('wave').textContent = game.wave;
  document.getElementById('enemies').textContent = game.enemies.length;
  document.getElementById('biome').textContent = biome.name;
}

function mixColors(c1, c2, t) {
  const h1 = parseInt(c1.slice(1), 16);
  const h2 = parseInt(c2.slice(1), 16);
  const r = Math.round(((h1 >> 16) & 255) * (1-t) + ((h2 >> 16) & 255) * t);
  const g = Math.round(((h1 >> 8) & 255) * (1-t) + ((h2 >> 8) & 255) * t);
  const b = Math.round((h1 & 255) * (1-t) + (h2 & 255) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// ============================================================
// TELA DE SELEÇÃO
// ============================================================
function buildSelectScreen() {
  const wrap = document.getElementById('charCards');
  wrap.innerHTML = '';
  Object.keys(CHARACTERS).forEach(key => {
    const c = CHARACTERS[key];
    const div = document.createElement('div');
    div.className = 'charCard';
    div.style.borderColor = c.color;
    div.innerHTML =
      '<div style="width:60px;height:60px;margin:0 auto;border-radius:50%;background:' + c.color + ';box-shadow:0 0 20px ' + c.color + '88;"></div>' +
      '<h2 style="color:' + c.color + '">' + c.name + '</h2>' +
      '<div class="role">' + c.role + '</div>' +
      '<div class="stat">Vida <span>' + c.hp + '</span></div>' +
      '<div class="stat">Velocidade <span>' + c.speed.toFixed(1) + '</span></div>' +
      '<div class="stat">Dano <span>' + c.bulletDamage + '</span></div>' +
      '<div class="stat">Cadência <span>' + c.fireRate + '</span></div>' +
      '<div class="special">⭐ ' + c.specialName + '</div>';
    div.onclick = () => {
      document.getElementById('selectScreen').style.display = 'none';
      initGame(key);
      startWave();
      canvas.focus();
    };
    wrap.appendChild(div);
  });
}

// ============================================================
// INPUT
// ============================================================
canvas.addEventListener('click', () => canvas.focus());

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k) !== -1) e.preventDefault();
  if (!game) return;
  game.keys[k] = true;
  if (game.gameOver && e.key === 'Enter') {
    document.getElementById('selectScreen').style.display = 'flex';
    buildSelectScreen();
  }
  if (k === 'q') useSpecial();
});

document.addEventListener('keyup', e => {
  if (game) game.keys[e.key.toLowerCase()] = false;
});

window.addEventListener('blur', () => { if (game) game.keys = {}; });

canvas.addEventListener('mousemove', e => {
  if (!game) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  game.mouseX = (e.clientX - rect.left) * scaleX;
  game.mouseY = (e.clientY - rect.top) * scaleY;
});

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  if (e.button === 2) useSpecial();
});

if (isTouch) {
  const btn = document.getElementById('specialBtn');
  btn.style.display = 'block';
  btn.addEventListener('touchstart', e => { e.preventDefault(); useSpecial(); }, { passive: false });
  btn.addEventListener('click', e => { e.preventDefault(); useSpecial(); });
}

canvas.addEventListener('touchstart', e => {
  if (game && game.gameOver) {
    e.preventDefault();
    document.getElementById('selectScreen').style.display = 'flex';
    buildSelectScreen();
  }
}, { passive: false });

// ============================================================
// LOOP
// ============================================================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

buildSelectScreen();
loop();
</script>
